<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
      sessionStorage.setItem(
        'redirectPath',
        window.location.pathname + window.location.search + window.location.hash
      );
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
